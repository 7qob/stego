name: Image

# Builds the arm64 container and publishes it to GHCR. The Pi only ever pulls —
# it never compiles anything, which is the entire reason this workflow exists
# (better-sqlite3 and sharp are native modules).

on:
  push:
    branches: [main]
    # Docs and the deploy runbook change far more often than the image does.
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'nest-cli.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  workflow_dispatch:

# A second push while the first is still emulating arm64 should replace it,
# not queue behind it.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs natively on x64 in about a minute. A type error fails here rather than
  # partway through an emulated build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  image:
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # the only write scope this needs

    steps:
      - uses: actions/checkout@v4

      # The Pi is arm64 and these runners are x64. Only the dependency stage is
      # emulated; the Dockerfile pins the TypeScript build to the host arch.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Issued to the run automatically. No personal access token to
          # create, store or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stego
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=stego
            org.opencontainers.image.description=Self-hosted file host with Discord-friendly embeds and LSB steganography

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every run re-resolves the native modules under
          # emulation from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'On the Pi: `cd ~/stego && docker compose pull && docker compose up -d`' >> "$GITHUB_STEP_SUMMARY"
