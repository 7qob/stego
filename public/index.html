<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stego</title>
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0e0e0e" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <svg hidden aria-hidden="true">
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" />
        <polyline points="16 16 12 12 8 16" />
        <line x1="12" y1="12" x2="12" y2="21" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </symbol>
      <symbol id="i-github" viewBox="0 0 24 24">
        <path
          d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
        />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <line x1="7" y1="17" x2="17" y2="7" />
        <polyline points="7 7 17 7 17 17" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </symbol>
      <symbol id="i-fire" viewBox="0 0 24 24">
        <path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-3s-3 2-3 6a6 6 0 0 0 12 0c0-6-6-11-6-11z" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </symbol>
    </svg>

    <main class="panel">
      <header class="section head">
        <h1>stego</h1>
        <span class="handle">7qob</span>
      </header>

      <section class="section">
        <div class="stage" id="stage">
          <label class="drop" for="picker">
            <input id="picker" type="file" hidden />
            <svg class="icon"><use href="#i-upload" /></svg>
            <span class="drop-title">Drop a file</span>
            <span class="drop-hint" id="hint">or click to choose</span>
          </label>
          <form class="paste" id="importForm" hidden>
            <input
              id="importUrl"
              type="url"
              placeholder="or paste a link…"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" id="importBtn">
              <svg class="icon"><use href="#i-link" /></svg>Grab
            </button>
          </form>
          <div class="option">
            <svg class="icon"><use href="#i-clock" /></svg>
            <label for="minutes">Delete after</label>
            <input id="minutes" type="number" min="0" step="1" inputmode="numeric" value="60" />
            <span id="minutesHint">minutes</span>
          </div>

          <div class="options" id="options" hidden>
            <div class="option" id="burnRow" hidden>
              <svg class="icon"><use href="#i-fire" /></svg>
              <label for="burn">Burn after</label>
              <input id="burn" type="number" min="0" step="1" inputmode="numeric" placeholder="0" />
              <span>reads · 0 = unlimited</span>
            </div>

            <div class="option" id="lockRow" hidden>
              <svg class="icon"><use href="#i-lock" /></svg>
              <label for="lock">Passphrase</label>
              <input id="lock" type="password" autocomplete="new-password" placeholder="optional" />
            </div>

            <div class="option" id="privateRow" hidden>
              <svg class="icon"><use href="#i-shield" /></svg>
              <label for="private">Private link</label>
              <input id="private" type="checkbox" />
              <span>the server never sees it</span>
            </div>
          </div>

          <p class="note" id="privacyNote"></p>
        </div>
      </section>

      <section class="section" id="progressSection" hidden>
        <div id="progress" class="progress"><div id="bar" class="bar"></div></div>
      </section>

      <section class="section rows" id="result" hidden>
        <button type="button" class="row" data-copy="url">
          <svg class="icon"><use href="#i-link" /></svg>
          <span class="row-text">
            <span class="row-label">Share link</span>
            <span class="row-desc" id="urlDesc"></span>
          </span>
          <span class="row-mark"><svg class="icon"><use href="#i-copy" /></svg></span>
        </button>
        <button type="button" class="row" data-copy="del" id="deleteRow" hidden>
          <svg class="icon"><use href="#i-trash" /></svg>
          <span class="row-text">
            <span class="row-label">Delete link</span>
            <span class="row-desc" id="deleteDesc"></span>
          </span>
          <span class="row-mark"><svg class="icon"><use href="#i-copy" /></svg></span>
        </button>
        <p class="note" id="expiryNote"></p>
      </section>

      <section class="section" id="errorSection" hidden>
        <p class="error"><svg class="icon"><use href="#i-alert" /></svg><span id="error"></span></p>
      </section>

      <section class="section">
        <a class="row" href="https://github.com/7qob" target="_blank" rel="noopener noreferrer">
          <svg class="icon"><use href="#i-github" /></svg>
          <span class="row-text">
            <span class="row-label">GitHub</span>
            <span class="row-desc">7qob — source for this and the rest</span>
          </span>
          <span class="row-mark"><svg class="icon"><use href="#i-arrow" /></svg></span>
        </a>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
