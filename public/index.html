<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stego</title>
    <meta name="theme-color" content="#0e0e0e" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <svg hidden aria-hidden="true">
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" />
        <polyline points="16 16 12 12 8 16" />
        <line x1="12" y1="12" x2="12" y2="21" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        <line x1="10" y1="11" x2="10" y2="17" />
        <line x1="14" y1="11" x2="14" y2="17" />
      </symbol>
      <symbol id="i-github" viewBox="0 0 24 24">
        <path
          d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
        />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <line x1="7" y1="17" x2="17" y2="7" />
        <polyline points="7 7 17 7 17 17" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </symbol>
    </svg>

    <main class="panel">
      <header class="section head">
        <h1>stego</h1>
        <span class="handle">7qob</span>
      </header>

      <section class="section">
        <div class="stage" id="stage">
          <label class="drop" for="picker">
            <input id="picker" type="file" hidden />
            <svg class="icon"><use href="#i-upload" /></svg>
            <span class="drop-title">Drop a file</span>
            <span class="drop-hint" id="hint">or click to choose</span>
          </label>
          <form class="paste" id="importForm" hidden>
            <input
              id="importUrl"
              type="url"
              placeholder="or paste a link…"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" id="importBtn">
              <svg class="icon"><use href="#i-link" /></svg>Grab
            </button>
          </form>
        </div>
      </section>

      <section class="section" id="progressSection" hidden>
        <div id="progress" class="progress"><div id="bar" class="bar"></div></div>
      </section>

      <section class="section rows" id="result" hidden>
        <button type="button" class="row" data-copy="url">
          <svg class="icon"><use href="#i-link" /></svg>
          <span class="row-text">
            <span class="row-label">Share link</span>
            <span class="row-desc" id="urlDesc"></span>
          </span>
          <span class="row-mark"><svg class="icon"><use href="#i-copy" /></svg></span>
        </button>
        <button type="button" class="row" data-copy="rawUrl">
          <svg class="icon"><use href="#i-arrow" /></svg>
          <span class="row-text">
            <span class="row-label">Direct file</span>
            <span class="row-desc" id="rawUrlDesc"></span>
          </span>
          <span class="row-mark"><svg class="icon"><use href="#i-copy" /></svg></span>
        </button>
        <button type="button" class="row" data-copy="deleteUrl">
          <svg class="icon"><use href="#i-trash" /></svg>
          <span class="row-text">
            <span class="row-label">Delete link</span>
            <span class="row-desc">Save it — shown once</span>
          </span>
          <span class="row-mark"><svg class="icon"><use href="#i-copy" /></svg></span>
        </button>
      </section>

      <section class="section" id="errorSection" hidden>
        <p class="error"><svg class="icon"><use href="#i-alert" /></svg><span id="error"></span></p>
      </section>

      <section class="section">
        <a class="row" href="https://github.com/7qob" target="_blank" rel="noopener noreferrer">
          <svg class="icon"><use href="#i-github" /></svg>
          <span class="row-text">
            <span class="row-label">GitHub</span>
            <span class="row-desc">7qob — source for this and the rest</span>
          </span>
          <span class="row-mark"><svg class="icon"><use href="#i-arrow" /></svg></span>
        </a>
      </section>
    </main>

    <script>
      const stage = document.getElementById('stage');
      const picker = document.getElementById('picker');
      const progressSection = document.getElementById('progressSection');
      const progress = document.getElementById('progress');
      const bar = document.getElementById('bar');
      const result = document.getElementById('result');
      const errorSection = document.getElementById('errorSection');
      const errorEl = document.getElementById('error');
      const hint = document.getElementById('hint');
      const importForm = document.getElementById('importForm');
      const importUrl = document.getElementById('importUrl');
      const importBtn = document.getElementById('importBtn');

      /** Copy targets live here, not in inputs — the rows show them as text. */
      const values = {};

      fetch('/api/limits')
        .then((r) => r.json())
        .then((l) => {
          hint.textContent = `or click to choose · up to ${formatBytes(l.maxFileSize)}`;
          if (l.importEnabled) importForm.hidden = false;
        })
        .catch(() => {});

      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        const units = ['KB', 'MB', 'GB', 'TB'];
        let v = bytes / 1024;
        let i = 0;
        while (v >= 1024 && i < units.length - 1) {
          v /= 1024;
          i++;
        }
        return v.toFixed(v < 10 ? 1 : 0) + ' ' + units[i];
      }

      ['dragenter', 'dragover'].forEach((type) =>
        stage.addEventListener(type, (e) => {
          e.preventDefault();
          stage.classList.add('active');
        }),
      );

      ['dragleave', 'drop'].forEach((type) =>
        stage.addEventListener(type, (e) => {
          e.preventDefault();
          stage.classList.remove('active');
        }),
      );

      stage.addEventListener('drop', (e) => {
        const file = e.dataTransfer?.files?.[0];
        if (file) return upload(file);

        // Dragging an image out of another tab hands us a URL, not a file.
        const dropped =
          e.dataTransfer?.getData('text/uri-list') || e.dataTransfer?.getData('text/plain');
        if (dropped && /^https?:\/\//i.test(dropped.trim())) grab(dropped.trim());
      });

      importForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const value = importUrl.value.trim();
        if (value) grab(value);
      });

      picker.addEventListener('change', () => {
        if (picker.files[0]) upload(picker.files[0]);
      });

      document.querySelectorAll('[data-copy]').forEach((row) => {
        const mark = row.querySelector('.row-mark use');
        row.addEventListener('click', async () => {
          await navigator.clipboard.writeText(values[row.dataset.copy] || '');
          mark.setAttribute('href', '#i-check');
          setTimeout(() => mark.setAttribute('href', '#i-copy'), 1200);
        });
      });

      function upload(file) {
        start();

        const body = new FormData();
        body.append('file', file);

        // XHR rather than fetch: it reports upload progress, which matters
        // when the server is a Pi on a home uplink.
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload');

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) bar.style.width = (e.loaded / e.total) * 100 + '%';
        });

        xhr.addEventListener('load', () => {
          progressSection.hidden = true;
          let payload;
          try {
            payload = JSON.parse(xhr.responseText);
          } catch {
            return fail('Unexpected server response');
          }
          if (xhr.status >= 400) return fail(payload.message || 'Upload failed');
          show(payload);
        });

        xhr.addEventListener('error', () => {
          progressSection.hidden = true;
          fail('Network error');
        });

        xhr.send(body);
      }

      /** Pull a remote URL server-side. No upload progress exists to report. */
      function grab(url) {
        start();
        importUrl.value = url;
        importBtn.disabled = true;
        progress.classList.add('indeterminate');

        fetch('/api/import', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ url }),
        })
          .then(async (response) => {
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.message || 'Import failed');
            show(payload);
            importUrl.value = '';
          })
          .catch((e) => fail(e.message))
          .finally(() => {
            progressSection.hidden = true;
            progress.classList.remove('indeterminate');
            importBtn.disabled = false;
          });
      }

      function start() {
        errorSection.hidden = true;
        result.hidden = true;
        progressSection.hidden = false;
        bar.style.width = '0%';
      }

      function show(payload) {
        values.url = payload.url;
        values.rawUrl = payload.rawUrl;
        values.deleteUrl = payload.deleteUrl;
        document.getElementById('urlDesc').textContent = payload.url;
        document.getElementById('rawUrlDesc').textContent = payload.rawUrl;
        result.hidden = false;
      }

      function fail(message) {
        errorEl.textContent = message;
        errorSection.hidden = false;
      }
    </script>
  </body>
</html>
